# prefixキーを変更する
set -g prefix C-f

# デフォルトのprefixキーを解除する
unbind C-b

# マウス操作を有効にする
set-option -g mouse on

# windowのインデックスを1から始める
set -g base-index 1

# windowの前景色（背景色を付けてしまうとwindows terminal側で設定した透過が反映されなくなる）
set -g window-style 'fg=colour245'
set -g window-active-style 'fg=colour255'

# status-lineの設定
set -g status-fg white
set -g status-bg "colour018"
set-option -g status-right " %m/%d(%a) %H:%M "

# ウィンドウ一覧の見やすさ改善
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=colour039,fg=colour016,bold"
set -g window-status-style "fg=colour250"
set -g window-status-separator ""

# prefix+r で設定のリロード
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Alt+数字でウィンドウ切り替え
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+矢印でウィンドウ切り替え
bind -n M-Left previous-window
bind -n M-Right next-window

# ペインの移動
bind -n C-o select-pane -t :.+
bind -n C-Left select-pane -L
bind -n C-Down select-pane -D
bind -n C-Up select-pane -U
bind -n C-Right select-pane -R

# lazygitをポップアップで開く
bind g display-popup -E -d "#{pane_current_path}" -w 97% -h 97% "lazygit"

# prefix + ? で、fzf検索付きキーバインドヘルプ（ポップアップ）
unbind ?
bind ? display-popup -E -w 90% -h 90% "tmux list-keys -N | fzf --prompt='tmux keys> '"
